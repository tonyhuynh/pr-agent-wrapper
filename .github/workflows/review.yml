name: PR-Agent review
on:
  workflow_call:
    inputs:
      model:
        type: string
        required: true
      fallback_models:
        type: string
        default: '[]'
      extra_instructions:
        type: string
        default: ''
      num_max_findings:
        type: number
        default: 3
      ignore_globs:
        type: string
        default: '["vendor/**"]'
      api_base:
        type: string
        default: ''
      custom_model_max_tokens:
        type: number
        default: 0
      max_model_tokens:
        type: number
        default: 64000
      reasoning_effort:
        type: string
        default: ''
      response_language:
        type: string
        default: en-US
      ai_timeout:
        type: number
        default: 300
      comment_mode:
        type: string
        default: update
      large_pr_chunking:
        type: boolean
        default: false
    secrets:
      XAI_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      GROQ_API_KEY:
        required: false
      DEEPSEEK_API_KEY:
        required: false
      MISTRAL_API_KEY:
        required: false
permissions:
  contents: read
jobs:
  capture:
    if: >-
      contains(fromJSON('["pull_request_target","pull_request"]'), github.event_name) &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["opened","reopened","synchronize","ready_for_review"]'), github.event.action)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      captured: ${{ steps.capture.outputs.captured }}
      providers: ${{ steps.capture.outputs.providers }}
      merge_base: ${{ steps.capture.outputs.merge_base }}
      diff_sha256: ${{ steps.capture.outputs.diff_sha256 }}
      run_attempt: ${{ steps.capture.outputs.run_attempt }}
    steps:
      - name: Capture diff and save runtime
        id: capture
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
          GH_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/prw-runtime.py" <<'PRW_REVIEW_PY'
          import fnmatch
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import sys
          import tarfile
          import tempfile
          import urllib.request

          UPSTREAM = "e673a02076ce09a4726c3d0c3cc85780e59ca52b"
          SOURCE_BLOBS = {
              "docker/Dockerfile": "6c493a4ecb6ac5c7a53c7265e7afdeccbbd636bc",
              "pr_agent/cli.py": "c23accc027abc76805511d02709ad62d3f5c3010",
              "pr_agent/config_loader.py": "873b2d3b09dfb9ee89c1b07a886da461c08642d1",
              "pr_agent/custom_merge_loader.py": "6517a1d858bff67c2ad48d793de87cdd5b8297ad",
              "pr_agent/settings/configuration.toml": "59a91bd441365757bbf3ad5d3a487afb18d3d718",
              "pr_agent/settings/ignore.toml": "938d7fb648260320975ee7f6a086328696c2ccbc",
              "pr_agent/algo/file_filter.py": "2096bb957502427541a7715b3fe3147966374082",
              "pr_agent/algo/pr_processing.py": "51c302a0dc2604e5a61c63aad8efbacbf22741fa",
              "pr_agent/algo/ai_handlers/cloud_auth.py": "d1bba80193204e64e56155f8d26e904a4864602d",  # gitleaks:allow (a public Git blob ID; the path contains "auth")
              "pr_agent/algo/ai_handlers/litellm_ai_handler.py": "05da9c02a6c11931ed685037165f50f9ead74f65",
              "pr_agent/git_providers/plain_diff_provider.py": "4908670602d7723468e0c036ff41b5d8c0e6c8c3",
              "pr_agent/algo/run_output.py": "7cb1600a505ea9a2e457734cb0ad996d9d8608a5",
              "pr_agent/algo/run_details.py": "bd28076bdf2762c28b454168eae8108500a5f201",
              "pr_agent/settings/i18n/en.toml": "2f7d6cb17af79df703c283e180179df710bb7c06",
              "pr_agent/settings/i18n/es.toml": "307780e8f9a23ac29d587796908cec2cc3fc4bc8",
              "pr_agent/algo/setting_utils.py": "450fc75ab1c2fca801cc493f60b1d60d649f0baf",
              "pr_agent/tools/pr_reviewer.py": "8661343da20406d2b6150106eb3478b2abb0c1dc",
              "uv.lock": "e1f05e7ae041d7b4a439fa4a4a516a14c7c94968",
          }
          IMAGE = "pr-agent-wrapper:local"
          MAX_DIFF = 4 * 1024 * 1024
          MAX_REVIEW = 8 * 1024 * 1024
          COMMENT_LIMIT = 60000
          KEYS = {
              "xai": ("XAI_API_KEY", "XAI__KEY"),
              "openai": ("OPENAI_API_KEY", "OPENAI__KEY"),
              "anthropic": ("ANTHROPIC_API_KEY", "ANTHROPIC__KEY"),
              "gemini": ("GEMINI_API_KEY", "GOOGLE_AI_STUDIO__GEMINI_API_KEY"),
              "openrouter": ("OPENROUTER_API_KEY", "OPENROUTER__KEY"),
              "groq": ("GROQ_API_KEY", "GROQ__KEY"),
              "deepseek": ("DEEPSEEK_API_KEY", "DEEPSEEK__KEY"),
              "mistral": ("MISTRAL_API_KEY", "MISTRAL__KEY"),
          }
          # OpenRouter and Groq address models as vendor/model[:variant]; the other providers do not.
          NESTED_MODEL_PROVIDERS = {"openrouter", "groq"}
          INPUT_NAMES = {"model", "fallback_models", "extra_instructions", "num_max_findings", "ignore_globs",
                         "api_base", "custom_model_max_tokens", "max_model_tokens", "reasoning_effort",
                         "response_language", "ai_timeout", "comment_mode", "large_pr_chunking"}
          REASONING_EFFORTS = {"none", "minimal", "low", "medium", "high", "xhigh", "max"}
          COMMENT_MODES = {"update", "new"}
          # Model calls PR-Agent may make for one review when large_pr_chunking is on.
          CHUNK_CALLS = 3
          # Never reviewed, whatever the caller passes. PR-Agent already skips *.lock by extension.
          ALWAYS_IGNORED = ["vendor/**", "**/package-lock.json", "**/npm-shrinkwrap.json", "**/pnpm-lock.yaml", "**/go.sum"]
          # PR-Agent's own fixed failure reasons, each mapped to wording from this file. Nothing else is ever shown.
          FAILURE_REASONS = {
              "The model provider rejected the request because the API account has insufficient credits. Add credits, then retry the command.":
                  ("credits", "The provider says the account has insufficient credits."),
              "PR-Agent could not authenticate with the model provider. Check the configured API credentials, then retry.":
                  ("auth", "The provider rejected the API key."),
              "The model provider rate-limited the request. Wait for the limit to reset, then retry.":
                  ("rate_limit", "The provider rate-limited the request."),
              "The model provider timed out before completing the review. Retry the command or adjust the provider timeout.":
                  ("timeout", "The provider timed out. Raise `ai_timeout`, lower `reasoning_effort`, or add a fallback model. For a large diff, leave files out with `ignore_globs`; the capture job's summary lists the largest files."),
              "The pull request exceeded the selected model's context limit. Retry with a larger-context model or an incremental review.":
                  ("context", "The diff exceeds the model's context limit. Lower `max_model_tokens` or pick a larger model."),
              "PR-Agent could not reach the model provider. Check provider availability and network access, then retry.":
                  ("unreachable", "The runner could not reach the provider."),
              "Every configured model attempt failed. Check the PR-Agent service logs for the provider error, then retry.":
                  ("all_failed", "Every model in the chain failed. Check the model ID and the API key."),
              "PR-Agent encountered an unexpected internal error. Check the PR-Agent service logs for details.":
                  ("internal", "PR-Agent failed without a recognized provider error. Check the model ID; for a model newer than the pinned PR-Agent, set `custom_model_max_tokens`."),
          }
          # Dynaconf converter tokens. A value that starts with one is evaluated, not read.
          DIRECTIVES = ("bool|capitalize|casefold|comment|del|empty|float|format|get|insert|int|jinja|json|lower|lstrip|"
                        "merge|merge_unique|none|note|null|read_file|reset|rstrip|split|str|strip|swapcase|title|upper")
          FIXED = {
              "pr_reviewer.persistent_comment": False,
              "pr_reviewer.persistent_finding_state": False,
              "pr_reviewer.final_update_message": False,
              "pr_reviewer.publish_output_no_suggestions": True,
              "pr_reviewer.inline_key_issues": False,
              "pr_reviewer.enable_review_labels_security": False,
              "pr_reviewer.enable_review_labels_effort": False,
              "pr_reviewer.max_number_of_calls": CHUNK_CALLS,
              "pr_reviewer.publish_error_details": True,
              "config.publish_output_progress": False,
              "config.output_run_details": True,
              "config.enable_auto_approval": False,
              "config.num_retries": 0,
              "config.retry_same_model_on_timeout": False,
              "config.retry_same_model_on_length": False,
              "config.use_repo_settings_file": False,
              "config.use_global_settings_file": False,
              "config.use_group_settings_file": False,
              "config.global_settings_repo": "",
              "config.enable_per_directory_settings": False,
              "config.extra_config_url": "",
              "config.repo_context_files": [],
              "config.repo_context_sibling_repos": [],
              "config.secret_provider": "",
              "config.propagate_tool_errors": True,
              "config.log_level": "CRITICAL",
              "config.verbosity_level": 0,
              "config.output_relevant_configurations": False,
              "config.persistent_inline_comments": False,
              "model_routing.enable": False,
              "model_routing.rules": [],
              "litellm.custom_llm_provider": "",
              "litellm.enable_callbacks": False,
              "litellm.success_callback": [],
              "litellm.failure_callback": [],
              "litellm.service_callback": [],
              "litellm.turn_off_message_logging": True,
              "otel.is_enabled": False,
              "otel.exporter_type": "none",
              "skills.enabled": False,
              "skills.paths": [],
              "artifacts.enable": False,
              "artifacts.artifact_path": "",
              "github.publish_as_check_run": False,
              "push_outputs.enable": False,
              "push_outputs.channels": [],
          }


          class WrapperError(ValueError):
              """A failure whose message is a fixed string that is safe to print."""


          def require(value, message):
              # Messages are literals from this file. Never interpolate caller or provider data.
              if not value:
                  raise WrapperError(message)
              return value


          def safe_text(value, limit, multiline=False):
              require(isinstance(value, str) and len(value.encode("utf-8")) <= limit, "wrong type or too long")
              # Dynaconf evaluates a value only when it starts with a converter token, so mentions
              # such as @Override, @types/node, or an email address are safe mid-text. Converter
              # tokens stay forbidden anywhere in case a later settings copy re-parses a fragment.
              require(not value.lstrip().startswith("@"), "must not start with an at sign")
              require(not re.search(r"@(?:" + DIRECTIVES + r")(?![A-Za-z0-9_])", value, re.I),
                      "must not contain a Dynaconf directive such as @json or @format")
              require(not any(ord(c) < 32 and (not multiline or c not in "\n\t") for c in value), "control characters are forbidden")
              require("\x7f" not in value, "control characters are forbidden")
              return value


          def model(value):
              safe_text(value, 160)
              segment = r"[A-Za-z0-9][A-Za-z0-9._-]*"
              message = "expected <provider>/<model> with a supported provider prefix"
              provider, _, name = value.partition("/")
              require(provider in KEYS and 0 < len(name) <= 128, message)
              if provider in NESTED_MODEL_PROVIDERS:
                  require(re.fullmatch(segment + "(?:/" + segment + r")*(?::[A-Za-z0-9][A-Za-z0-9._-]*)?", name), message)
              else:
                  require(re.fullmatch(segment, name), message)
              return value


          def array_text(value, count, item_limit):
              safe_text(value, 8192, True)
              try:
                  parsed = json.loads(value)
              except ValueError:
                  raise WrapperError("must be a JSON array of strings") from None
              require(type(parsed) is list and len(parsed) <= count, "must be a JSON array within the documented size")
              for item in parsed:
                  safe_text(item, item_limit)
                  require(bool(item.strip()), "array items must not be empty")
              require(len(set(parsed)) == len(parsed), "array items must be distinct")
              return parsed


          def integer(value, low, high, zero_ok=False):
              require(type(value) is int and ((zero_ok and value == 0) or low <= value <= high), "must be an integer in the documented range")
              return value


          def endpoint(value, chain):
              safe_text(value, 512)
              if not value:
                  return None
              # Plain HTTPS origin plus path. No credentials, query, or fragment in the URL.
              match = re.fullmatch(r"https://([A-Za-z0-9.-]{1,253})(?::([0-9]{1,5}))?(?:/[A-Za-z0-9._~/-]*)?", value)
              require(match, "must be an https URL without credentials, query, or fragment")
              labels = match.group(1).lower().split(".")
              # A public DNS name: no IP literal, no single-label or local-only host.
              require(len(labels) >= 2 and all(re.fullmatch(r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?", label) for label in labels)
                      and re.fullmatch(r"[a-z][a-z0-9-]*", labels[-1]) and labels[-1] not in {"localhost", "local", "internal"},
                      "must name a public host, not an IP address or a local name")
              require(match.group(2) is None or 1 <= int(match.group(2)) <= 65535, "must use a port from 1 to 65535")
              require(any(item.startswith("openai/") for item in chain), "requires an openai/ model, which it redirects")
              return value


          def choice(value, allowed):
              require(isinstance(value, str) and value in allowed, "is not one of the documented values")
              return value


          def boolean(value):
              require(type(value) is bool, "must be true or false")
              return value


          def language(value):
              require(isinstance(value, str) and re.fullmatch(r"[a-z]{2,3}-[A-Z]{2}", value), "must be a locale such as en-US")
              return value


          def checked(name, function, *args):
              # Name the input in the error. The value itself is never echoed.
              try:
                  return function(*args)
              except WrapperError as error:
                  raise WrapperError("Invalid input `" + name + "`: " + str(error)) from None


          def instructions(text, globs):
              # The model cannot see ignored files. Say so, or it reports them as missing, such as a lockfile.
              note = ("Files matching these patterns were deliberately left out of this diff: " + json.dumps(globs) +
                      ". Do not report them as missing, and do not report a missing change to them.")
              return text + "\n\n" + note if text.strip() else note


          def settings(inputs):
              require(set(inputs) == INPUT_NAMES, "Unexpected workflow inputs")
              primary = checked("model", model, inputs["model"])
              fallbacks = checked("fallback_models", array_text, inputs["fallback_models"], 4, 160)
              for item in fallbacks:
                  checked("fallback_models", model, item)
              checked("fallback_models", require, primary not in fallbacks, "must not repeat the primary model")
              count = checked("num_max_findings", integer, inputs["num_max_findings"], 1, 10)
              globs = checked("ignore_globs", array_text, inputs["ignore_globs"], 32, 256)
              globs = list(dict.fromkeys([*ALWAYS_IGNORED, *globs]))
              checked("comment_mode", choice, inputs["comment_mode"], COMMENT_MODES)
              config = {**FIXED, "config.model": primary, "config.fallback_models": fallbacks,
                        "pr_reviewer.extra_instructions": instructions(checked("extra_instructions", safe_text, inputs["extra_instructions"], 8192, True), globs),
                        "pr_reviewer.num_max_findings": count, "ignore.glob": globs,
                        "config.ai_timeout": checked("ai_timeout", integer, inputs["ai_timeout"], 30, 540),
                        "config.max_model_tokens": checked("max_model_tokens", integer, inputs["max_model_tokens"], 4000, 2000000),
                        "config.response_language": checked("response_language", language, inputs["response_language"]),
                    "pr_reviewer.enable_large_pr_chunking": checked("large_pr_chunking", boolean, inputs["large_pr_chunking"])}
              # Optional settings are sent only when set, so upstream defaults apply otherwise.
              custom = checked("custom_model_max_tokens", integer, inputs["custom_model_max_tokens"], 1000, 2000000, True)
              if custom:
                  config["config.custom_model_max_tokens"] = custom
              if inputs["reasoning_effort"] != "":
                  config["config.reasoning_effort"] = checked("reasoning_effort", choice, inputs["reasoning_effort"], REASONING_EFFORTS)
              base = checked("api_base", endpoint, inputs["api_base"], [primary, *fallbacks])
              if base:
                  config["openai.api_base"] = base
              return config


          def encode(value):
              # A TOML literal. PR-Agent reads settings while they are still loading, and in that state
              # Dynaconf skips "@" converters such as @json but still parses TOML.
              if isinstance(value, bool):
                  return "true" if value else "false"
              if isinstance(value, int):
                  return str(value)
              if isinstance(value, str):
                  return '"' + "".join(c if c >= " " and c not in '"\\\x7f' else "\\u%04x" % ord(c) for c in value) + '"'
              require(isinstance(value, list), "Unsupported setting type")
              return "[" + ", ".join(encode(item) for item in value) + "]"


          def serialize(config):
              return {key.upper().replace(".", "__"): encode(value) for key, value in config.items()}


          SECRET_ERROR_MESSAGES = {
              public: "Missing required workflow secret: " + public + ". Configure it before inference."
              for public, _ in KEYS.values()
          }


          class MissingProviderSecret(ValueError):
              def __init__(self, secret_name):
                  require(secret_name in SECRET_ERROR_MESSAGES, "Unknown provider secret name")
                  self.secret_name = secret_name
                  super().__init__(SECRET_ERROR_MESSAGES[secret_name])


          def provider_keys(config, environment):
              result = {}
              for item in [config["config.model"], *config["config.fallback_models"]]:
                  public, native = KEYS[item.split("/", 1)[0]]
                  value = environment.get(public, "")
                  if not isinstance(value, str) or not value.strip():
                      raise MissingProviderSecret(public)
                  safe_text(value, 8192)
                  result[native] = encode(value)
              return result


          def oid(value):
              require(isinstance(value, str) and re.fullmatch(r"[0-9a-f]{40}", value), "Invalid Git object ID")
              return value


          def identity(event, repository, event_name):
              require(event_name in {"pull_request_target", "pull_request"}, "Only PR events are accepted")
              require(re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9_.-]{1,100}", repository)
                      and repository.split("/")[1] not in {".", ".."}, "Invalid repository")
              require(event.get("action") in {"opened", "reopened", "synchronize", "ready_for_review"}, "Unsupported event action")
              pr = event["pull_request"]
              require(event["repository"]["full_name"] == repository, "Repository mismatch")
              require(pr["base"]["repo"]["full_name"] == repository, "Base repository mismatch")
              require(pr["head"]["repo"]["full_name"] == repository and pr["head"]["repo"]["fork"] is False, "Fork PRs are excluded")
              require(pr["draft"] is False and pr["state"] == "open", "Draft or closed PRs are excluded")
              number = event["number"]
              require(type(number) is int and number > 0 and type(pr["number"]) is int and pr["number"] == number, "Invalid PR number")
              # Derive the URL from a validated repository; never trust metadata URLs.
              return {"repository": repository, "pr_number": number, "base": oid(pr["base"]["sha"]), "head": oid(pr["head"]["sha"])}


          def digest(data):
              return hashlib.sha256(data).hexdigest()


          def clean_env(root):
              home = root / "home"
              home.mkdir(exist_ok=True)
              return {"PATH": "/usr/local/bin:/usr/bin:/bin", "HOME": str(home), "LANG": "C.UTF-8",
                      "GIT_CONFIG_NOSYSTEM": "1", "GIT_CONFIG_GLOBAL": "/dev/null",
                      "GIT_TERMINAL_PROMPT": "0", "GIT_LFS_SKIP_SMUDGE": "1",
                      "DOCKER_CONFIG": str(home)}


          def git_diff(meta, root, token, run=subprocess.run):
              bare = root / "objects.git"
              env = clean_env(root)
              # Configuration is isolated without changing or bypassing hooks.
              def git(*args):
                  p = run(["git", "-c", "protocol.file.allow=never", "-c", "protocol.ext.allow=never",
                           *args], env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=True, timeout=300)
                  return p.stdout
              git("init", "--bare", str(bare))
              if token:
                  import base64
                  env.update({"GIT_CONFIG_COUNT": "1", "GIT_CONFIG_KEY_0": "http.https://github.com/.extraheader",
                              "GIT_CONFIG_VALUE_0": "AUTHORIZATION: basic " + base64.b64encode(("x-access-token:" + token).encode()).decode()})
              url = "https://github.com/" + meta["repository"] + ".git"
              # Full ancestry is needed for an exact merge base. No checkout or mutable refs.
              git("--git-dir=" + str(bare), "fetch", "--no-tags", "--no-recurse-submodules", url, meta["base"], meta["head"])
              for sha in (meta["base"], meta["head"]):
                  require(git("--git-dir=" + str(bare), "cat-file", "-t", sha).strip() == b"commit", "Object is not a commit")
              bases = git("--git-dir=" + str(bare), "merge-base", "--all", meta["base"], meta["head"]).decode().splitlines()
              require(len(bases) == 1, "Ambiguous or missing merge base")
              merge_base = oid(bases[0])
              patch = git("--git-dir=" + str(bare), "-c", "diff.renames=false", "diff", "--no-ext-diff", "--no-textconv",
                          "--no-color", "--src-prefix=a/", "--dst-prefix=b/", "--unified=3", "--ignore-submodules=all",
                          merge_base, meta["head"], "--")
              require(len(patch) <= MAX_DIFF, "Diff exceeds 4 MiB")
              patch.decode("utf-8")
              shutil.rmtree(bare)
              return merge_base, patch


          def globstars(pattern):
              # Offsets of whole "**/" segments outside bracket expressions, as PR-Agent finds them.
              offsets, index, last_close = [], 0, pattern.rfind("]")
              while index < len(pattern):
                  if pattern[index] == "[":
                      end = index + 1
                      if pattern[end:end + 1] == "!":
                          end += 1
                      end += 1
                      if end <= last_close:
                          while pattern[end] != "]":
                              end += 1
                          index = end + 1
                      else:
                          index += 1
                  elif pattern.startswith("**/", index) and (index == 0 or pattern[index - 1] == "/"):
                      offsets.append(index)
                      index += 3
                  else:
                      index += 1
              return offsets


          def ignore_patterns(globs):
              # The pinned PR-Agent's glob rule, used here only to report what it will leave out: fnmatch,
              # where "*" crosses "/" and each "**/" segment may also match no directory.
              regexes, expandable = {}, []
              for pattern in dict.fromkeys(globs):
                  for form in ([pattern, pattern[3:]] if pattern.startswith("**/") else [pattern]):
                      if form:
                          regexes[fnmatch.translate(form)] = None
                  offsets = globstars(pattern)
                  if offsets and len(offsets) <= 6 and len(pattern) <= 256:
                      expandable.append((pattern.split("/"), [pattern[:offset].count("/") for offset in offsets]))
              variants = 0
              for segments, stars in expandable:
                  for mask in range(1, 1 << len(stars)):
                      dropped = {index for bit, index in enumerate(stars) if mask >> bit & 1}
                      variant = "/".join(segment for index, segment in enumerate(segments) if index not in dropped)
                      translation = fnmatch.translate(variant) if variant else None
                      if not variant or translation in regexes:
                          continue
                      if variants >= 256:
                          break
                      regexes[translation] = None
                      variants += 1
              return [re.compile(regex) for regex in regexes]


          def diff_summary(patch, globs, count=5):
              # Sizes of the captured diff and of what `ignore_globs` leaves out, to help the caller tune it.
              patterns = ignore_patterns(globs)
              sent, left = [], []
              for part in re.split(rb"(?m)^(?=diff --git )", patch):
                  head = part.split(b"\n", 1)[0].decode("utf-8", "replace")
                  if not head.startswith("diff --git "):
                      continue
                  rest = head[len("diff --git "):]
                  name = rest[2:2 + (len(rest) - 5) // 2]
                  known = rest == "a/" + name + " b/" + name
                  # Paths come from the PR. Show only plain ones, so a path cannot add markup to the summary.
                  plain = known and re.fullmatch(r"[A-Za-z0-9._/@+\[\]()~,= -]{1,200}", name)
                  ignored = known and any(pattern.match(name) for pattern in patterns)
                  (left if ignored else sent).append((len(part), "`" + name + "`" if plain else "(path not shown)"))
              kib = lambda size: str(max(1, round(size / 1024))) + " KiB"
              total = lambda rows: str(len(rows)) + " file(s), " + kib(sum(size for size, _ in rows))
              lines = ["### PR-Agent review input", "", "Captured diff: " + total(sent + left) + ". The run's artifact holds all of it.", ""]
              if left:
                  lines += ["`ignore_globs` and the built-in exclusions leave out " + total(left) + ". "
                            "PR-Agent receives " + total(sent) + ", and also skips binary and `.lock` files.", ""]
              for title, rows in (("Largest files sent", sent), ("Largest files left out", left)):
                  if rows:
                      lines += ["| " + title + " | Diff size |", "| --- | --- |"]
                      lines += ["| " + name + " | " + kib(size) + " |" for size, name in sorted(rows, key=lambda item: -item[0])[:count]]
                      lines.append("")
              return "\n".join(lines)


          def prepare(root):
              root.mkdir()
              config = settings(json.loads(os.environ["INPUTS_JSON"]))
              meta = identity(json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text()), os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_EVENT_NAME"])
              for key in ("run_id", "run_attempt"):
                  value = os.environ["GITHUB_" + key.upper()]
                  require(re.fullmatch(r"[1-9][0-9]*", value), "Invalid run identity")
                  meta[key] = value
              merge_base, patch = git_diff(meta, root, os.environ.get("GH_READ_TOKEN", ""))
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                      f.write(diff_summary(patch, config["ignore.glob"]))
              meta.update({"schema": 1, "upstream": UPSTREAM, "merge_base": merge_base, "diff_sha256": digest(patch),
                           "status": "not_run", "reason": "", "review_sha256": digest(b"")})
              (root / "input").mkdir()
              (root / "artifact").mkdir()
              (root / "output").mkdir(mode=0o777)
              (root / "output").chmod(0o777)
              (root / "input/review.diff").write_bytes(patch)
              (root / "artifact/review.diff").write_bytes(patch)
              (root / "artifact/review.md").write_bytes(b"")
              (root / "config.json").write_text(json.dumps(config))
              (root / "artifact/manifest.json").write_text(json.dumps(meta))
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  providers = sorted({m.split("/", 1)[0] for m in [config["config.model"], *config["config.fallback_models"]]})
                  f.write("providers=" + json.dumps(providers) + "\n")
                  f.write(f"captured=true\nmerge_base={merge_base}\ndiff_sha256={meta['diff_sha256']}\nrun_attempt={meta['run_attempt']}\n")


          def build(root):
              # This step has no provider secrets or GitHub token in its environment.
              source = root / "source"
              source.mkdir()
              archive = root / "source.tar.gz"
              url = "https://codeload.github.com/The-PR-Agent/pr-agent/tar.gz/" + UPSTREAM
              with urllib.request.urlopen(url, timeout=60) as response, archive.open("wb") as f:
                  total = 0
                  while chunk := response.read(1024 * 1024):
                      total += len(chunk)
                      require(total <= 64 * 1024 * 1024, "Source archive too large")
                      f.write(chunk)
              with tarfile.open(archive) as tar:
                  members = tar.getmembers()
                  require(sum(m.size for m in members) <= 256 * 1024 * 1024, "Expanded source too large")
                  prefix = "pr-agent-" + UPSTREAM
                  for item in members:
                      parts = Path(item.name).parts
                      require(parts and parts[0] == prefix and ".." not in parts and not Path(item.name).is_absolute(), "Unsafe archive path")
                      require(item.isfile() or item.isdir(), "Archive links and special files are forbidden")
                  tar.extractall(source, members=members, filter="data")
              source = source / ("pr-agent-" + UPSTREAM)
              for name, expected in SOURCE_BLOBS.items():
                  data = (source / name).read_bytes()
                  actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
                  require(actual == expected, "Pinned source blob mismatch")
              require(not list(source.rglob(".secrets.toml")), "Packaged credentials forbidden")
              subprocess.run(["docker", "build", "--target", "cli", "--file", str(source / "docker/Dockerfile"),
                              "--tag", IMAGE, str(source)], env=clean_env(root), check=True, timeout=900)
              archive.unlink()
              shutil.rmtree(source.parent)


          def docker_command(root, names):
              command = ["docker", "run", "--rm", "--name", "pr-agent-wrapper-review", "--read-only", "--user", "65532:65532",
                         "--cap-drop=ALL", "--security-opt=no-new-privileges", "--pids-limit=128", "--memory=4g", "--cpus=2",
                         "--ulimit", "nofile=1024:1024", "--ulimit", "fsize=8388608:8388608", "--network=bridge",
                         "--tmpfs", "/tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777",
                         "--tmpfs", "/scratch:rw,noexec,nosuid,nodev,size=16m,mode=1777",
                         "--workdir", "/scratch", "--mount", f"type=bind,src={root / 'input'},dst=/input,readonly",
                         "--mount", f"type=bind,src={root / 'output'},dst=/output", "--entrypoint", "/app/.venv/bin/python"]
              for name in sorted(names):
                  command.extend(["--env", name])
              return command + [IMAGE, "/app/pr_agent/cli.py", "--diff-file", "/input/review.diff", "--output", "/output/review.md", "review"]


          def classify(data, config):
              if not data.strip():
                  return "empty_output"
              text = data.decode("utf-8")
              require("\x00" not in text, "Invalid output")
              primary, fallbacks = config["config.model"], config["config.fallback_models"]
              chain = [primary, *fallbacks]
              # PR-Agent ends its output with a gear-marked run-details block whose first bullet names the model.
              # It translates the labels, so match the block's position and shape and the model names, not its words:
              # "- <label>: <model>", with a parenthesized note when a fallback answered. Bullets in the review body
              # come before the last gear and are ignored, so the reviewed diff cannot forge or duplicate the line.
              named = []
              _, gear, tail = text.rpartition("\u2699")
              first = re.search(r"^- [^\n\r]*$", tail, re.M) if gear else None
              match = re.fullmatch(r"- [^:\n\r]{1,60}: ([^\n\r]+)", first.group(0)) if first else None
              if match:
                  value = match.group(1)
                  names, note = value, ""
                  if value.endswith(")") and " (" in value:
                      names, note = value[:-1].rsplit(" (", 1)
                  models = names.split(", ")
                  if len(set(models)) == len(models) and set(models) <= set(chain):
                      named.append((models, bool(note)))
              known = False
              if len(named) == 1:
                  models, noted = named[0]
                  if len(models) == 1:
                      known = noted == (models[0] != primary)
                  else:
                      # A chunked review names every model that answered a chunk.
                      known = config["pr_reviewer.enable_large_pr_chunking"]
              if not known:
                  return "missing_model_details"
              return "oversized_output" if len(data) > COMMENT_LIMIT else "success"


          def failure_reason(data):
              # Exact match against PR-Agent's fixed reasons, so provider text can never reach the log or the PR.
              # Returns a code for the manifest and this file's own wording for the annotation.
              for upstream, (code, message) in FAILURE_REASONS.items():
                  if data.strip() == ("Failed to review PR\n\n**Reason:** " + upstream).encode():
                      return code, ". " + message
              return "", ""


          def infer(root):
              config = json.loads((root / "config.json").read_text())
              manifest_path = root / "artifact/manifest.json"
              meta = json.loads(manifest_path.read_text())
              data = b""
              status = "key_validation_failed"
              try:
                  credentials = provider_keys(config, os.environ)
                  status = "inference_failed"
                  env = {**clean_env(root), **serialize(config), **credentials, "HOME": "/tmp", "LOG_LEVEL": "CRITICAL",
                         "LITELLM_LOCAL_MODEL_COST_MAP": "True", "TOKENIZERS_PARALLELISM": "false"}
                  # docker client needs an isolated host HOME, while the container gets /tmp.
                  names = set(serialize(config)) | set(credentials) | {"HOME", "LOG_LEVEL", "LITELLM_LOCAL_MODEL_COST_MAP", "TOKENIZERS_PARALLELISM"}
                  env["HOME"] = str(root / "home")
                  cmd = docker_command(root, names)
                  # Explicit literal HOME avoids inheriting the Docker client's home path.
                  cmd[cmd.index("HOME")] = "HOME=/tmp"
                  try:
                      # Leave every model in the chain its full ai_timeout, for every chunk, before the container is stopped.
                      attempts = 1 + len(config["config.fallback_models"])
                      calls = CHUNK_CALLS if config["pr_reviewer.enable_large_pr_chunking"] else 1
                      limit = min(1500, max(600, config["config.ai_timeout"] * attempts * calls + 60))
                      completed = subprocess.run(cmd, env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=limit)
                  finally:
                      subprocess.run(["docker", "rm", "--force", "pr-agent-wrapper-review"], env=clean_env(root),
                                     stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=30)
                  path = root / "output/review.md"
                  if path.exists():
                      require(not path.is_symlink() and path.is_file() and path.stat().st_size <= MAX_REVIEW, "Unsafe output file")
                      data = path.read_bytes()
                      # Do not upload a value that matches any supplied provider secret.
                      require(not any(v and v.encode() in data for k, v in os.environ.items() if k in {p for p, _ in KEYS.values()}), "Secret in output")
                      require("\x00" not in data.decode("utf-8"), "Invalid output encoding")
                  status = classify(data, config) if completed.returncode == 0 else "inference_failed"
              except MissingProviderSecret as error:
                  # Emit only a fixed message indexed by an allowed secret name.
                  print(SECRET_ERROR_MESSAGES.get(error.secret_name, "Provider secret validation failed."), file=sys.stderr)
                  data = b""
              except Exception:
                  # Provider errors and output may contain credentials. Keep them out of logs.
                  data = b""
              (root / "artifact/review.md").write_bytes(data)
              code, detail = failure_reason(data) if status == "inference_failed" else ("", "")
              meta.update(status=status, reason=code, review_sha256=digest(data))
              manifest_path.write_text(json.dumps(meta))
              require(status == "success", "Review failed: " + status + detail)


          if __name__ == "__main__":
              try:
                  root = Path(os.environ["RUNNER_TEMP"]) / "prw"
                  {"prepare": prepare, "build": build, "infer": infer}[sys.argv[1]](root)
              except WrapperError as error:
                  # Fixed wording from this file, shown as an annotation on the run.
                  print("::error title=PR-Agent wrapper::" + str(error))
                  raise SystemExit(1)
              except Exception:
                  print("Wrapper step failed; no provider details are logged.", file=sys.stderr)
                  raise SystemExit(1)
          PRW_REVIEW_PY
          python3 "$RUNNER_TEMP/prw-runtime.py" prepare
          cp "$RUNNER_TEMP/prw-runtime.py" "$RUNNER_TEMP/prw/runtime.py"
      - name: Upload immutable input and workflow runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-review-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prw/
          if-no-files-found: error
          retention-days: 3
  review:
    needs: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {}
    outputs:
      run_attempt: ${{ steps.attempt.outputs.run_attempt }}
    steps:
      # "Re-run failed jobs" reruns this job without rerunning capture, so the input is named after capture's attempt.
      - name: Record this attempt
        id: attempt
        shell: bash
        run: echo "run_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Download the captured input
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-review-input-${{ github.run_id }}-${{ needs.capture.outputs.run_attempt }}
          path: ${{ runner.temp }}/prw/
      - name: Build pinned public source without credentials
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/prw/output"
          chmod 777 "$RUNNER_TEMP/prw/output"
          python3 "$RUNNER_TEMP/prw/runtime.py" build
      - name: Preflight keys and run patch-only native review
        env:
          XAI_API_KEY: ${{ contains(fromJSON(needs.capture.outputs.providers), 'xai') && secrets.XAI_API_KEY || '' }}
          OPENAI_API_KEY: ${{ contains(fromJSON(needs.capture.outputs.providers), 'openai') && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ contains(fromJSON(needs.capture.outputs.providers), 'anthropic') && secrets.ANTHROPIC_API_KEY || '' }}
          GEMINI_API_KEY: ${{ contains(fromJSON(needs.capture.outputs.providers), 'gemini') && secrets.GEMINI_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ contains(fromJSON(needs.capture.outputs.providers), 'openrouter') && secrets.OPENROUTER_API_KEY || '' }}
          GROQ_API_KEY: ${{ contains(fromJSON(needs.capture.outputs.providers), 'groq') && secrets.GROQ_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ contains(fromJSON(needs.capture.outputs.providers), 'deepseek') && secrets.DEEPSEEK_API_KEY || '' }}
          MISTRAL_API_KEY: ${{ contains(fromJSON(needs.capture.outputs.providers), 'mistral') && secrets.MISTRAL_API_KEY || '' }}
        shell: bash
        run: python3 "$RUNNER_TEMP/prw/runtime.py" infer
      - name: Upload captured comparison and native result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-review-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prw/artifact/
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: [capture, review]
    if: always() && needs.capture.result == 'success' && needs.capture.outputs.captured == 'true' && needs.review.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download the review job's result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-review-result-${{ github.run_id }}-${{ needs.review.outputs.run_attempt }}
          path: ${{ runner.temp }}/prw-artifact/
      - name: Validate artifact and publish the review comment
        env:
          CAPTURED_JSON: ${{ toJSON(needs.capture.outputs) }}
          COMMENT_MODE: ${{ inputs.comment_mode }}
          GH_PUBLISH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PRW_PUBLISH_PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import sys
          import urllib.request

          UPSTREAM = "e673a02076ce09a4726c3d0c3cc85780e59ca52b"
          STATUSES = {"success", "not_run", "key_validation_failed", "inference_failed", "empty_output", "oversized_output", "missing_model_details"}
          PROVIDERS = "xai|openai|anthropic|gemini|openrouter|groq|deepseek|mistral"
          MODEL = "(?:" + PROVIDERS + ")/[A-Za-z0-9][A-Za-z0-9._:/-]*"
          COMMENT_MODES = {"update", "new"}
          # First line of every comment this workflow writes. Update mode edits only a
          # comment that starts with it and was written by the Actions bot.
          MARKER = "<!-- pr-agent-wrapper:review -->"
          BOT = "github-actions[bot]"
          # A failed run adds a notice between these two lines at the top of the comment. The next review replaces the whole comment.
          NOTICE = "<!-- pr-agent-wrapper:notice -->"
          NOTICE_END = "<!-- pr-agent-wrapper:end-notice -->"
          # Every sentence a failure notice can contain. The manifest selects one by status and reason code.
          STATUS_TEXT = {
              "not_run": "The review job stopped before PR-Agent ran.",
              "key_validation_failed": "A provider API key is missing. The `review` job's log names the secret.",
              "inference_failed": "PR-Agent could not produce a review.",
              "empty_output": "PR-Agent wrote no review.",
              "oversized_output": "The review is larger than a GitHub comment allows. The full output is in the run's artifact.",
              "missing_model_details": "The review lacks the footer that names the model. The output is in the run's artifact.",
          }
          REASON_TEXT = {
              "credits": "The provider says the account has insufficient credits.",
              "auth": "The provider rejected the API key.",
              "rate_limit": "The provider rate-limited the request.",
              "timeout": "The provider timed out. Raise `ai_timeout`, lower `reasoning_effort`, or add a fallback model. For a large diff, leave files out with `ignore_globs`; the capture job's summary lists the largest files.",
              "context": "The diff exceeds the model's context limit. Lower `max_model_tokens` or pick a larger model.",
              "unreachable": "The runner could not reach the provider.",
              "all_failed": "Every model in the chain failed. Check the model ID and the API key.",
              "internal": "PR-Agent failed without a recognized provider error. Check the model ID; for a model newer than the pinned PR-Agent, set `custom_model_max_tokens`.",
          }


          class WrapperError(ValueError):
              """A failure whose message is a fixed string that is safe to print."""


          def require(value, message):
              if not value:
                  raise WrapperError(message)


          def read_file(root, name, limit):
              path = root / name
              require(not path.is_symlink() and path.is_file() and path.stat().st_size <= limit, "Invalid artifact file")
              data = path.read_bytes()
              require(len(data) <= limit, "Oversized artifact")
              return data


          def expected_identity(event, env):
              repo = env["GITHUB_REPOSITORY"]
              require(re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9_.-]{1,100}", repo)
                      and repo.split("/")[1] not in {".", ".."}, "Invalid repository")
              require(env["GITHUB_EVENT_NAME"] in {"pull_request_target", "pull_request"}, "Invalid event")
              require(event["action"] in {"opened", "reopened", "synchronize", "ready_for_review"}, "Invalid action")
              pr = event["pull_request"]
              require(event["repository"]["full_name"] == repo and pr["base"]["repo"]["full_name"] == repo, "Repository mismatch")
              require(pr["head"]["repo"]["full_name"] == repo and pr["head"]["repo"]["fork"] is False, "Fork excluded")
              require(pr["draft"] is False and pr["state"] == "open", "Draft or closed PR")
              require(type(event["number"]) is int and event["number"] > 0 and type(pr["number"]) is int
                      and pr["number"] == event["number"], "Invalid PR")
              captured = json.loads(env["CAPTURED_JSON"])
              require(captured["captured"] == "true", "Missing capture")
              result = {"schema": 1, "upstream": UPSTREAM, "repository": repo, "pr_number": event["number"],
                        "base": pr["base"]["sha"], "head": pr["head"]["sha"], "merge_base": captured["merge_base"],
                        "diff_sha256": captured["diff_sha256"], "run_id": env["GITHUB_RUN_ID"],
                        # The attempt that captured the diff. A rerun of only the failed jobs keeps it.
                        "run_attempt": captured["run_attempt"]}
              for key in ("base", "head", "merge_base"):
                  require(isinstance(result[key], str) and re.fullmatch(r"[0-9a-f]{40}", result[key]), "Invalid object ID")
              require(re.fullmatch(r"[0-9a-f]{64}", result["diff_sha256"]), "Invalid diff hash")
              for key in ("run_id", "run_attempt"):
                  require(re.fullmatch(r"[1-9][0-9]*", result[key]), "Invalid run identity")
              return result


          def validate(root, expected):
              require(not root.is_symlink() and root.is_dir(), "Invalid artifact directory")
              require({p.name for p in root.iterdir()} == {"manifest.json", "review.diff", "review.md"}, "Unexpected artifact files")
              manifest = json.loads(read_file(root, "manifest.json", 16384))
              require(type(manifest) is dict and set(manifest) == set(expected) | {"status", "reason", "review_sha256"}, "Invalid manifest schema")
              require(all(manifest[k] == v and type(manifest[k]) is type(v) for k, v in expected.items()), "Artifact identity mismatch")
              require(manifest["status"] in STATUSES, "Invalid review status")
              require(manifest["reason"] == "" or (manifest["status"] == "inference_failed" and manifest["reason"] in REASON_TEXT), "Invalid failure reason")
              patch = read_file(root, "review.diff", 4 * 1024 * 1024)
              review = read_file(root, "review.md", 8 * 1024 * 1024)
              require(hashlib.sha256(patch).hexdigest() == expected["diff_sha256"], "Diff hash mismatch")
              require(hashlib.sha256(review).hexdigest() == manifest["review_sha256"], "Review hash mismatch")
              patch.decode("utf-8")
              text = review.decode("utf-8")
              require("\x00" not in text, "Invalid Markdown")
              if manifest["status"] == "success":
                  # The footer labels follow the review language; the model names do not.
                  # The first bullet after the last gear mark is PR-Agent's own model line; bullets in the body are ignored.
                  _, gear, tail = text.rpartition("\u2699")
                  first = re.search(r"^- [^\n\r]*$", tail, re.M) if gear else None
                  require(text.strip() and len(review) <= 60000 and first
                          and re.fullmatch(r"- [^:\n\r]{1,60}: " + MODEL + "(, " + MODEL + r")*( \([^()\n\r]{1,60}\))?", first.group(0)), "Missing native output or model identity")
              return manifest, text


          def summary(text):
              # Fixed wording plus validated identifiers only.
              path = os.environ.get("GITHUB_STEP_SUMMARY")
              if path:
                  with open(path, "a") as f:
                      f.write(text + "\n")
              print(text)


          def own_comment(client, repository, number):
              """Return (id, body) of this workflow's newest comment on the PR, or None."""
              found = None
              for page in range(1, 51):
                  comments = client.list_comments(repository, number, page)
                  require(type(comments) is list, "Unexpected comment listing")
                  for item in comments:
                      user = item.get("user") or {}
                      if (user.get("login") == BOT and user.get("type") == "Bot" and isinstance(item.get("body"), str)
                              and item["body"].startswith(MARKER) and type(item.get("id")) is int and item["id"] > 0):
                          found = (item["id"], item["body"])
                  if len(comments) < 20:
                      break
              return found


          def failure_notice(manifest, expected, previous):
              # Fixed wording and validated identifiers only. `previous` is the comment's earlier text, without its notice.
              text = REASON_TEXT.get(manifest["reason"]) or STATUS_TEXT[manifest["status"]]
              lines = [NOTICE, "> **PR-Agent could not review commit `" + expected["head"] + "`.** " + text,
                       "> [Run log](https://github.com/" + expected["repository"] + "/actions/runs/" + expected["run_id"] + ")"]
              if previous:
                  lines.append("> The review below is from an earlier run.")
              return MARKER + "\n" + "\n".join(lines) + "\n" + NOTICE_END + "\n" + ("\n" + previous if previous else "")


          def without_notice(body):
              rest = body[len(MARKER):].lstrip("\n")
              if rest.startswith(NOTICE):
                  end = rest.find(NOTICE_END)
                  rest = rest[end + len(NOTICE_END):].lstrip("\n") if end >= 0 else ""
              return rest


          def publish(root, expected, client, mode="update"):
              require(mode in COMMENT_MODES, "Invalid comment mode")
              manifest, native = validate(root, expected)
              failed = manifest["status"] != "success"
              if failed:
                  note = "PR-Agent review failed. Status: `" + manifest["status"] + "`."
                  if manifest["status"] in {"oversized_output", "missing_model_details"}:
                      note += " Native output is retained in this run's artifact without truncation."
                  summary(note)
              current = client.get_pr(expected["repository"], expected["pr_number"])
              require(current["base"]["repo"]["full_name"] == expected["repository"] and
                      current["head"]["repo"]["full_name"] == expected["repository"] and
                      current["head"]["repo"]["fork"] is False, "Current PR identity changed")
              require(current["state"] == "open" and current["draft"] is False, "PR is now closed or draft")
              for side in ("base", "head"):
                  require(re.fullmatch(r"[0-9a-f]{40}", current[side]["sha"]), "Invalid current object ID")
              advanced = any(current[k]["sha"] != expected[k] for k in ("base", "head"))
              existing = own_comment(client, expected["repository"], expected["pr_number"]) if mode == "update" else None
              if failed:
                  if current["head"]["sha"] != expected["head"]:
                      # The run for the newer head reports on it.
                      summary("No failure notice posted: the PR has a newer head than this run captured.")
                      return None
                  # Keep the last good review and put the notice above it. No native output is posted.
                  body = failure_notice(manifest, expected, without_notice(existing[1]) if existing else "")
                  if len(body.encode("utf-8")) > 65000:
                      summary("No failure notice posted: the existing comment has no room for it.")
                      return None
                  if existing is None:
                      result = client.create_comment(expected["repository"], expected["pr_number"], body)
                      summary("PR-Agent failure notice posted as a new comment.")
                  else:
                      result = client.update_comment(expected["repository"], existing[0], body)
                      summary("PR-Agent failure notice added to the existing comment.")
                  return result
              if existing and current["head"]["sha"] != expected["head"] and ("Head: `" + current["head"]["sha"] + "`") in existing[1]:
                  # A newer run already reviewed the current head. Do not overwrite it with an older review.
                  summary("PR-Agent review skipped: the comment already covers a newer head than this run captured.")
                  return None
              prefix = (MARKER + "\nPR-Agent captured comparison\n\n"
                        f"Repository: `{expected['repository']}`; PR: #{expected['pr_number']}\n"
                        f"Base: `{expected['base']}`\nHead: `{expected['head']}`\n"
                        f"Merge base: `{expected['merge_base']}`\nDiff SHA256: `{expected['diff_sha256']}`\n\n")
              if advanced:
                  prefix += "The PR advanced after capture. This output describes the captured SHAs above.\n\n"
              body = prefix + native
              require(len(body.encode("utf-8")) <= 65000, "Comment too large")
              # One comment per call. No evaluation, review events, labels, or edits to other authors' comments.
              if existing is None:
                  result = client.create_comment(expected["repository"], expected["pr_number"], body)
                  summary("PR-Agent review posted as a new comment.")
              else:
                  result = client.update_comment(expected["repository"], existing[0], body)
                  summary("PR-Agent review updated the existing comment.")
              return result


          class GitHubClient:
              def __init__(self, token):
                  self.token = token

              def request(self, path, payload=None, method=None, limit=2 * 1024 * 1024):
                  request = urllib.request.Request("https://api.github.com/repos/" + path, method=method,
                                                   data=None if payload is None else json.dumps(payload).encode(),
                                                   headers={"Authorization": "Bearer " + self.token, "Accept": "application/vnd.github+json",
                                                            "Content-Type": "application/json", "X-GitHub-Api-Version": "2022-11-28"})
                  # Do not forward authorization through redirects.
                  class NoRedirect(urllib.request.HTTPRedirectHandler):
                      def redirect_request(self, *args, **kwargs):
                          return None
                  opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
                  with opener.open(request, timeout=30) as response:
                      data = response.read(limit + 1)
                      require(len(data) <= limit, "API response too large")
                      return json.loads(data)

              def get_pr(self, repository, number):
                  return self.request(f"{repository}/pulls/{number}")

              def list_comments(self, repository, number, page):
                  # 20 comments at GitHub's size limit, in the widest encoding, fit in the raised limit.
                  return self.request(f"{repository}/issues/{number}/comments?per_page=20&page={page}", limit=8 * 1024 * 1024)

              def create_comment(self, repository, number, body):
                  # No automatic POST retries: a lost response must not create duplicates.
                  return self.request(f"{repository}/issues/{number}/comments", {"body": body})

              def update_comment(self, repository, comment_id, body):
                  return self.request(f"{repository}/issues/comments/{comment_id}", {"body": body}, method="PATCH")


          if __name__ == "__main__":
              try:
                  expected = expected_identity(json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text()), os.environ)
                  publish(Path(os.environ["RUNNER_TEMP"]) / "prw-artifact", expected, GitHubClient(os.environ["GH_PUBLISH_TOKEN"]),
                          os.environ.get("COMMENT_MODE", ""))
              except WrapperError as error:
                  print("::error title=PR-Agent wrapper::" + str(error))
                  raise SystemExit(1)
              except Exception:
                  print("Publishing failed; artifact validation or comment creation did not complete.", file=sys.stderr)
                  raise SystemExit(1)
          PRW_PUBLISH_PY
