name: No-key checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned no-key test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-test.txt
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Validate workflows
        run: |
          "$(go env GOPATH)/bin/actionlint"
          .venv/bin/yamllint -d '{extends: relaxed, rules: {line-length: disable, truthy: disable}}' .github/workflows examples
          .venv/bin/python scripts/check_tree.py
      - name: Scan public files for secrets
        run: .venv/bin/python scripts/scan_public.py
      - name: Scan full history for secrets
        run: '"$(go env GOPATH)/bin/gitleaks" git --redact --no-banner .'
      - name: Fetch verified pinned source fixtures
        run: .venv/bin/python scripts/fetch_upstream.py
      - name: Run wrapper and stubbed upstream tests without keys
        run: .venv/bin/python -m unittest discover -s tests -v
